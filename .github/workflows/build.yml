# Auto-build D4Bot.exe on push
# Download the .exe from: Actions tab → latest run → Artifacts

name: Build D4Bot EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install numpy pyaml opencv-python pillow pyqt5 pyautogui pynput pydirectinput keyboard pywin32

      - name: Build EXE
        run: pyinstaller --clean --noconfirm d4_bot.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: D4Bot
          path: dist/D4Bot.exe
